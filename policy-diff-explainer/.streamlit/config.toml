# PolicyPulse Streamlit Configuration
# Reference: TECH_STACK.md Section 3

[server]
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#667EEA"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F9FC"
textColor = "#1E293B"
font = "sans serif"

[runner]
fastReruns = true
