# PolicyPulse Project Configuration

[project]
name = "policypulse"
version = "1.0.0"
description = "AI-powered synthetic population simulator for stress-testing policies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "streamlit.*",
    "plotly.*",
    "openai.*",
    "sklearn.*",
    "joblib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
